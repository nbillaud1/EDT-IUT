<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<title>Salles libres IUT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Référence : maquette/index.html validée le 2026-11-22. */
:root {
  --ink: #0E1A2B; --slate: #17263B; --rule: #24364F; --chalk: #EDE6D6; --dim: #7D8CA3;
  --free: #7BD88F; --amber: #F2B33D; --busy: #4F6180; --hit: #E8735A;
  --sign: "Barlow Condensed", "Arial Narrow", sans-serif;
  --text: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--ink); }
body {
  margin: 0; background: var(--ink); color: var(--chalk);
  font-family: var(--text); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(24px, env(safe-area-inset-top, 0px)) 48px;
}
main { max-width: 560px; margin: 0 auto; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.weeknav { display: flex; align-items: center; gap: 8px; }
.week { margin: 0; color: var(--dim); font-size: .95rem; }
.week.other { color: var(--amber); }
.weeknav button { flex: none; width: 32px; height: 32px; border: 1px solid var(--rule); border-radius: 6px; background: transparent; color: var(--chalk); font-size: 1.3rem; line-height: 1; cursor: pointer; }
.weeknav button:disabled { opacity: .3; cursor: default; }
.slot { margin: 2px 0 0; font-family: var(--sign); font-weight: 600; font-size: clamp(2.1rem, 9vw, 2.8rem); line-height: 1.05; text-wrap: balance; }
.slot .t { color: var(--amber); font-variant-numeric: tabular-nums; }
.note { margin: 6px 0 0; font-size: .85rem; color: var(--dim); }

form { margin-top: 20px; background: var(--slate); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.days button { border: 0; border-radius: 6px; padding: 9px 0; background: transparent; color: var(--dim); font-family: var(--sign); font-weight: 600; font-size: 1.1rem; cursor: pointer; }
.days button[aria-pressed="true"] { background: var(--chalk); color: var(--ink); }
.times { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.times label { color: var(--dim); font-size: .95rem; }
.times select { background: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; font-family: var(--sign); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.now { margin-left: auto; border: 1px solid var(--amber); background: transparent; color: var(--amber); border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.now:hover { background: var(--amber); color: var(--ink); }

.board { margin-top: 28px; }
.board h2 { margin: 0 0 4px; font-family: var(--sign); font-weight: 600; font-size: 1.35rem; }
.board h2 .count { color: var(--free); }
.board.taken h2 { color: var(--dim); }
.scale { display: grid; grid-template-columns: 4.2rem 1fr; gap: 0 14px; color: var(--dim); font-size: .75rem; font-variant-numeric: tabular-nums; }
.scale div { grid-column: 2; display: flex; justify-content: space-between; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 4.2rem 1fr; gap: 2px 14px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.num { grid-row: span 2; font-family: var(--sign); font-weight: 700; font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.until { font-size: .95rem; }
.until b { color: var(--amber); font-family: var(--sign); font-weight: 600; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.taken .num { color: var(--dim); font-size: 1.6rem; }
.taken .until b { color: var(--chalk); }

.day { position: relative; height: 14px; margin-block: 6px; border-radius: 3px; background: color-mix(in srgb, var(--free) 38%, var(--ink)); align-self: center; }
.day i { position: absolute; top: 0; bottom: 0; background: var(--busy); }
.day i.hit { background: var(--hit); }
.day s { position: absolute; top: -5px; bottom: -5px; border: 2px solid var(--amber); border-radius: 4px; text-decoration: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 12px; font-size: .8rem; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend span::before { content: ""; width: 14px; height: 10px; border-radius: 2px; }
.legend .l-free::before { background: color-mix(in srgb, var(--free) 38%, var(--ink)); }
.legend .l-busy::before { background: var(--busy); }
.legend .l-hit::before { background: var(--hit); }
.legend .l-slot::before { border: 2px solid var(--amber); height: 12px; }
.empty { margin: 8px 0 0; color: var(--dim); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 10px; }
.card { background: var(--slate); border-radius: 8px; border-top: 3px solid var(--free); padding: 10px 12px 12px; display: grid; gap: 2px; }
.card .num { grid-row: auto; font-size: 2.2rem; }
.card .until { font-size: .85rem; color: var(--dim); }
.card .until b { display: block; font-size: 1.2rem; white-space: nowrap; }

footer { margin-top: 32px; color: var(--dim); font-size: .85rem; display: grid; gap: 6px; }
footer p { margin: 0; max-width: 60ch; }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <div class="weeknav">
      <button type="button" id="prev" aria-label="Semaine précédente" hidden>‹</button>
      <p class="week" id="week">Chargement des emplois du temps…</p>
      <button type="button" id="next" aria-label="Semaine suivante" hidden>›</button>
    </div>
    <h1 class="slot" id="slot">Salles libres</h1>
    <p class="note" id="note" hidden></p>
  </header>

  <form id="f" hidden>
    <div class="days" id="days" role="group" aria-label="Jour"></div>
    <div class="times">
      <label for="from">De</label><select id="from"></select>
      <label for="to">à</label><select id="to"></select>
      <button type="button" class="now" id="now">Maintenant</button>
    </div>
  </form>

  <section class="board" aria-live="polite" id="freeBoard" hidden>
    <h2 id="freeTitle"></h2>
    <div class="cards" id="free"></div>
  </section>

  <section class="board taken" id="busyBoard" hidden>
    <h2>Occupées sur ce créneau</h2>
    <div class="legend"><span class="l-slot">ton créneau</span><span class="l-hit">cours qui bloque</span><span class="l-busy">autre cours</span><span class="l-free">libre</span></div>
    <div class="scale" aria-hidden="true"><div><span>8h</span><span>12h</span><span>16h</span><span>19h30</span></div></div>
    <ul id="busy"></ul>
  </section>

  <footer>
    <p id="unknown"></p>
    <p id="updated"></p>
    <p>Une salle prise par un autre département n'apparaît pas dans ces emplois du temps : vérifie la porte avant de t'installer.</p>
    <p>Source : <a href="https://edt-iut-info.unilim.fr/edt/">edt-iut-info.unilim.fr</a></p>
  </footer>
</main>

<script>
const DAY_KEYS = ["LUNDI", "MARDI", "MERCREDI", "JEUDI", "VENDREDI", "SAMEDI"];
const DAY_NAMES = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const OPEN = 8 * 60, CLOSE = 19 * 60 + 30, SPAN = CLOSE - OPEN;
const fmt = m => `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}`;
const $ = id => document.getElementById(id);
let data, week, wi, currentWi, day = 0, days;

// Date et heure à Paris, quel que soit le fuseau du téléphone.
function parisNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23", weekday: "short" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { iso: `${p.year}-${p.month}-${p.day}`, min: +p.hour * 60 + +p.minute, wd: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(p.weekday) };
}

// Semaine qui contient aujourd'hui, sinon la prochaine, sinon la dernière connue.
function pickWeek(weeks, iso) {
  return weeks.find(w => w.start <= iso && iso <= w.end) || weeks.find(w => w.start > iso) || weeks[weeks.length - 1];
}

const busyOf = r => (week.busy[DAY_KEYS[day]] || {})[r] || [];
function freeAt(slots, t) { for (const [s, e] of slots) if (s <= t && e > t) t = e; return t; }
const pct = m => ((Math.min(Math.max(m, OPEN), CLOSE) - OPEN) / SPAN * 100).toFixed(2) + "%";
const frise = (slots, from, to) =>
  `<div class="day" aria-hidden="true">${slots.map(([s, e]) => `<i class="${s < to && e > from ? "hit" : ""}" style="left:${pct(s)};width:calc(${pct(e)} - ${pct(s)})"></i>`).join("")}<s style="left:${pct(from)};width:calc(${pct(to)} - ${pct(from)})"></s></div>`;

function render() {
  const from = +$("from").value, to = +$("to").value;
  [...$("days").children].forEach(b => b.setAttribute("aria-pressed", +b.dataset.i === day));
  $("slot").innerHTML = `${DAY_NAMES[day]}, de <span class="t">${fmt(from)}</span> à <span class="t">${fmt(to)}</span>`;
  if (to <= from) {
    $("freeTitle").textContent = "L'heure de fin doit être après l'heure de début.";
    $("free").innerHTML = $("busy").innerHTML = ""; return;
  }
  const free = [], taken = [];
  for (const r of data.rooms) {
    const slots = busyOf(r), clash = slots.find(([s, e]) => s < to && e > from);
    if (clash) taken.push({ r, slots, at: freeAt(slots, Math.max(from, clash[0])) });
    else { const next = slots.find(([s]) => s >= to); free.push({ r, until: next ? next[0] : CLOSE }); }
  }
  free.sort((a, b) => b.until - a.until);
  taken.sort((a, b) => a.at - b.at);
  $("freeTitle").innerHTML = free.length
    ? `<span class="count">${free.length}</span> ${free.length > 1 ? "salles libres sur tout le créneau" : "salle libre sur tout le créneau"}`
    : "Aucune salle libre sur tout le créneau";
  $("free").innerHTML = free.length
    ? free.map(f => `<div class="card"><span class="num">${f.r}</span><span class="until">${f.until >= CLOSE ? "libre<b>jusqu'au soir</b>" : `libre jusqu'à<b>${fmt(f.until)}</b>`}</span></div>`).join("")
    : `<p class="empty">Essaie un créneau plus court ou un autre jour.</p>`;
  $("busy").innerHTML = taken.length
    ? taken.map(t => `<li><span class="num">${t.r}</span><span class="until">${t.at >= CLOSE ? "prise jusqu'au soir" : `se libère à <b>${fmt(t.at)}</b>`}</span>${frise(t.slots, from, to)}</li>`).join("")
    : `<p class="empty">Aucune.</p>`;
  const n = week.unknown[DAY_KEYS[day]] || 0;
  $("unknown").textContent = n ? `${n} cours ce jour-là n'indiquent pas de salle, ils ne sont pas comptés.` : "";
}

function setWeek(i) {
  wi = i; week = data.weeks[i];
  days = [0, 1, 2, 3, 4].concat(week.busy.SAMEDI ? [5] : []);
  const a = frDate(week.start), b = frDate(week.end), current = i === currentWi;
  $("week").textContent = `Semaine ${week.num}, du ${a.d}${a.m !== b.m ? " " + a.m : ""} au ${b.d} ${b.m}${current ? "" : " (pas la semaine en cours)"}`;
  $("week").classList.toggle("other", !current);
  $("prev").disabled = i === 0; $("next").disabled = i === data.weeks.length - 1;
  $("days").innerHTML = "";
  days.forEach(d => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.textContent = DAY_NAMES[d].slice(0, 3); btn.dataset.i = d; btn.setAttribute("aria-label", DAY_NAMES[d]);
    btn.onclick = () => { day = d; $("note").hidden = true; render(); };
    $("days").append(btn);
  });
  if (!days.includes(day)) day = days[0];
}

function setNow() {
  if (wi !== currentWi) setWeek(currentWi);
  const now = parisNow();
  let d = now.wd, start = Math.max(OPEN, Math.floor(now.min / 30) * 30), note = "";
  const inWeek = week.start <= now.iso && now.iso <= week.end;
  if (!inWeek || !days.includes(d) || start + 30 > CLOSE) {
    // Hors des cours : on regarde le prochain jour affiché, dès 8h.
    d = inWeek ? days.find(x => x > d) : undefined;
    if (d === undefined) d = days[0];
    start = OPEN;
    note = `Plus de cours aujourd'hui : on regarde ${DAY_NAMES[d].toLowerCase()} matin.`;
  }
  day = d; $("from").value = start; $("to").value = Math.min(start + 90, CLOSE);
  $("note").textContent = note; $("note").hidden = !note;
  render();
}

function frDate(iso) { const [y, m, dd] = iso.split("-").map(Number); return { d: dd, m: MONTHS[m - 1] }; }
function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 60) return `il y a ${Math.max(min, 1)} min`;
  if (min < 48 * 60) return `il y a ${Math.round(min / 60)} h`;
  return `il y a ${Math.round(min / 1440)} jours`;
}

async function start() {
  try {
    const res = await fetch("data.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    $("week").textContent = "Impossible de charger les emplois du temps. Vérifie ta connexion puis recharge la page.";
    return;
  }
  currentWi = data.weeks.indexOf(pickWeek(data.weeks, parisNow().iso));
  setWeek(currentWi);
  const step = k => { setWeek(wi + k); $("note").hidden = true; render(); };
  $("prev").onclick = () => step(-1);
  $("next").onclick = () => step(1);
  $("prev").hidden = $("next").hidden = false;
  for (let m = OPEN; m <= CLOSE; m += 30) { $("from").add(new Option(fmt(m), m)); $("to").add(new Option(fmt(m), m)); }
  $("updated").textContent = `Emplois du temps A1, A2 et A3 : dernier changement pris en compte ${ago(data.generated)}.`;
  ["from", "to"].forEach(id => $(id).addEventListener("change", () => { $("note").hidden = true; render(); }));
  $("now").addEventListener("click", setNow);
  $("f").addEventListener("submit", e => e.preventDefault());
  ["f", "freeBoard", "busyBoard"].forEach(id => $(id).hidden = false);
  setNow();
}
start();
</script>
</body>
</html>
