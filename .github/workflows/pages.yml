name: Mettre à jour les salles libres

# Déploie à chaque push (les données arrivent par tools/maj.ps1 depuis le PC).
# Pas de cron : le serveur de l'IUT ne répond pas aux machines de GitHub.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_edt.py
      # Le serveur de l'IUT ne répond pas toujours aux machines de GitHub (constaté le 2026-11-22) :
      # en cas d'échec on garde site/data.json du dépôt, mis à jour depuis un PC (tools/maj.ps1).
      - run: python tools/edt.py "$RUNNER_TEMP/out" && cp "$RUNNER_TEMP/out/data.json" site/data.json
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
